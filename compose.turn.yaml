services:
  turn:
    image: coturn/coturn:4.18.0-r0
    network_mode: host
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
      - /var/lib/coturn
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - ./turn/turnserver.conf:/etc/coturn/turnserver.conf:ro
      - ./turn/certs:/run/turn-certs:ro
